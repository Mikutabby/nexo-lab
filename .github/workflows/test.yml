name: Test

on:
  push:
    branches: [main, pr*-*]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Run shellcheck
        run: |
          find . -name '*.sh' -o -type f -exec grep -l '^#!/bin/bash' {} \; | while read f; do
            shellcheck "$f" || true
          done

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pytest
      - name: Run tests
        run: python3 -m pytest tests/test_nexo_graph.py -v --tb=short

  bats:
    name: bats syntax tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: Check shell syntax
        run: |
          errors=0
          find . -name '*.sh' -o -type f -exec grep -l '^#!/bin/bash' {} \; 2>/dev/null | while read f; do
            if ! bash -n "$f" 2>/dev/null; then
              echo "SYNTAX ERROR: $f"
              errors=$((errors + 1))
            fi
          done
          [ "$errors" -eq 0 ] || exit 1
      - name: Run bats tests
        run: bats tests/test_shell.bats || true

  flake8:
    name: flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install flake8
        run: pip install flake8
      - name: Run flake8
        run: |
          find . -type f -exec grep -l '^#!/usr/bin/env python3' {} \; 2>/dev/null | while read f; do
            flake8 "$f" --max-line-length=120 --ignore=E402,F401,E501 || true
          done

  markdown:
    name: markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install markdownlint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq markdownlint
      - name: Lint README
        run: markdownlint README.md || true
