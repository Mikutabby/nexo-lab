--[[
🔷 Nexo UI — Conky Widget
Widget de escritorio con info del sistema y estado de Nexo.
Requiere: conky, lua, json parser
--]]

conky.config = {
    -- Posición
    alignment = 'top_right',
    gap_x = 16,
    gap_y = 48,
    minimum_width = 260,
    maximum_width = 260,
    minimum_height = 180,

    -- Apariencia
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 160,
    own_window_colour = '000000',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    -- Fondo
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = true,
    draw_blended = false,
    stippled_borders = 0,
    border_inner_margin = 12,
    border_outer_margin = 0,
    border_width = 0,

    -- Fuente
    use_xft = true,
    xftalpha = 0.9,
    font = 'Ubuntu Mono:size=10',
    override_utf8_locale = true,

    -- Actualización
    update_interval = 2.0,
    total_run_times = 0,

    -- Color
    default_color = '00d4ff',
    color1 = '00ff88',
    color2 = 'ff4444',
    color3 = 'ffaa00',
    color4 = '888888',
    color5 = '00aaff',
    color6 = 'ffffff',

    -- CPU
    cpu_avg_samples = 2,
    net_avg_samples = 2,

    -- Padding
    use_spacer = 'none',
    uppercase = false,
}

conky.text = [[
${color6}${font Ubuntu Mono:bold:size=11}🔷 NEXO UI${font}${color}
${color4}${voffset -2}${hr 2}${color}

${color5}⎧ SISTEMA${color}
${color6}  CPU: ${cpu}% ${color}${cpubar 5,200}
${color6}  RAM: ${memperc}% ${color}${membar 5,200}
${color6}  Temp: ${hwmon 0 temp 1}°C${color}
${color6}  Disco: ${fs_used_perc /}% ${color}${fs_bar 5,200 /}
${color6}  Uptime: ${uptime_short}${color}

${color5}⎧ NEXO${color}
${color6}  Estado: ${execi 2 python3 /tmp/nexo-ui/conky/nexo-status.py}${color}
${color6}  ${execi 2 python3 -c "
import json
try:
    with open('/tmp/nexo-ui-state.json') as f:
        s = json.load(f)
    cmd = s.get('last_command','')
    if cmd:
        print(f'Último comando: {cmd[:30]}')
    else:
        print('Esperando comandos...')
except:
    print('Conectando...')
"}${color}

${color4}${voffset 2}${hr 2}${color}
${color4}${font Ubuntu Mono:size=8}${time %H:%M}  •  ${time %d/%m/%y}${font}${color}
]]
